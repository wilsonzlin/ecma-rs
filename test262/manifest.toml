[[expectations]]
regex = "^fail/(0d5e450f1da8a92a|265fda17a34611b1|320eade064b2c635|40449ddc6ec37b35|4ff4b78ff3e2de6e|50a060984b757dc1|66e667cc2b718770|748656edbfb2d0bb|79f882da06f88c9f|8a331fdde7032f33|8e93bcbd389c6bf6|90cd97db35a1a503|92b6af54adef3624|944ea2478d838026|98204d734f8c72b3|b9b5930aa449a36a|ca2716d236c027cd|db41a80ccf646002|e82474d52b99f1b7|ef81b93cf9bdb4ec|fb130c395c6aafe7)\\.js$"
status = "xfail"
reason = "Miscellaneous parser/lexer early-error gaps: string NonOctalDecimalEscape in sloppy (Annex B still allows; corpus expects reject), arrow function as immediate call callee (§15.3), parenthesized destructuring assignment target (§13.15.1), duplicate switch default (§14.12.1), labelled generator declaration (B.3.2), strict octal property name / string escape, unterminated string, class field shorthand. Not yet implemented."

