# Expectations for test262 parser tests.
#
# The runner parses every case with the strict `Ecma` dialect and, for the
# `early/`, `pass/`, and `pass-explicit/` corpora, additionally runs JS-mode
# binding (semantic-js) so that scope-dependent early errors (duplicate
# declarations, strict-mode rules, `new.target` placement, duplicate
# `__proto__`, `let`-as-binding-name, missing `const` initializer, ...) are
# enforced — and so binder over-strictness on the pass corpus is a harness
# failure. See test262/src/main.rs and wiki/crates/{parse-js,semantic-js}.md.
#
# The blanket `fail/**` and `early/**` xfails were replaced (2026-07-23) with the
# precise, per-cluster entries below. Each entry names the Early Error rule, its
# ECMA-262 section, and the owning layer. Matcher precedence: exact id > glob >
# regex (see wiki/engineering/testing.md).

# Template/string literal handling gaps (pass/pass-explicit corpus).
[[expectations]]
regex = "^(pass|pass-explicit)/(07bce073a241288b|431ecef8c85d4d24|5b39aca97d9006f4|647e21f8f157c338|69063bc9496ea6e5|6d707802519c7158|8af69d8f15295ed2|9cf32425f04fd865|d0dba4e03608ad64|e95b9364e90a4b5c|fb7c5656640f6ec7)\\.js$"
status = "xfail"
reason = "Template/string literal handling gaps."

# early-dup-block-function (5 cases)
[[expectations]]
regex = "^early/(12a74c60f52a60de|1aff49273f3e3a98|be7329119eaa3d47|e262ea7682c36f92|ec31fa5e521c5df4)\\.js$"
status = "xfail"
reason = "Duplicate function declarations sharing a block scope (ECMA-262 §14.2.1 / B.3.3). Binder-owned; not yet implemented."

# early-escaped-dup-binding (4 cases)
[[expectations]]
regex = "^early/(2c10310cb3f9beb8|50e4cd4d8fb1cdaa|abe07ddcc6b1cbc0|b4994b656f8c8e75)\\.js$"
status = "xfail"
reason = "Duplicate lexical BoundNames equal only after unicode-escape decoding (ECMA-262 §14.3.1). Parser retains raw identifier text so the binder sees distinct names; owner: parser identifier cooking."

